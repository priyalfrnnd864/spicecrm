<html>
<head>
    <title>SpiceCRM</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#CA1B1F">
    <link rel="SHORTCUT ICON" href="assets/images/favicon.png">
    <link rel="stylesheet" href="sldassets/styles/salesforce-lightning-design-system.min.css">
    <link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">
    <link rel="stylesheet" href="assets/spicecrm.css">
    <script src="vendor/core-js/client/shim.min.js"></script>
    <script src="vendor/zone.js/dist/zone.min.js"></script>
    <script src="vendor/reflect-metadata/Reflect.js"></script>
    <script src="vendor/systemjs/dist/system.js"></script>
    <script src="vendor/moment/moment.js"></script>
    <script src="vendor/moment/moment-timezone.js"></script>
    <script src="vendor/highcharts/highcharts.js"></script>
    <script src="vendor/highcharts/highcharts-more.js"></script>
    <script src="vendor/tinymce/tinymce.min.js"></script>
    <script src="vendor/js-barcode/JsBarcode.all.min.js"></script>
    <script src="vendor/signature_pad/signature_pad.js"></script>
    <script src="systemjs.config.js"></script>
    <script>
        System.import('app').catch(function (err) {
            console.error(err);
        });
    </script>
</head>
<body>
<spicecrm>
    <div style="height: 100vh;" class="slds-align--absolute-center">
        <div>
            <div>
                <img src="./assets/images/login_logo.png"/>
            </div>
            <div class="slds-text-align_center slds-p-around--medium">
                <span class="slds-p-top--medium">... preparing your experience ...</span>
                <div class="loaderspinner">
                    <svg class="bag" height="100" width="100">
                        <circle  cx="50" cy="50" r="25" stroke="#CA1B1F" stroke-width="3" fill="none"></circle>
                    </svg>
                    <svg class="over" height="100" width="100">
                        <circle  cx="50" cy="50" r="25" stroke="#ccc" stroke-width="3" fill="none" >
                            <animate attributeType="CSS" attributeName="stroke-dasharray" from="1,254" to="157,07" dur="5s" repeatCount="indefinite" />
                        </circle>
                    </svg>
                </div>
            </div>
        </div>
    </div>
    <div class="spiceLoginFooter">
        © 2016 aac services k.s. All rights reserved.
    </div>
</spicecrm>
</body>
</html>
